<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | Deniz Construction</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body class="login-page"><main class="login-card"><a class="login-brand" href="{{ url_for('login') }}"><span class="login-mark" aria-hidden="true">D</span><span>Deniz Construction<small>Operations management</small></span></a><h1>Sign in</h1><p class="muted">Enter your account details to continue.</p>
{% if error %}<p class="feedback error" role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ target }}"><label>Account<select name="username" autocomplete="username" required autofocus><option value="">Choose your account</option><option value="sales_manager" {{ 'selected' if request.form.get('username')=='sales_manager' }}>Sales Manager</option><option value="ceo" {{ 'selected' if request.form.get('username')=='ceo' }}>CEO</option></select></label><label>Password<input type="password" name="password" autocomplete="current-password" required maxlength="256"></label><button type="submit">Sign in</button></form><p class="muted">Sales Manager · Daily operations<br>CEO · Reports and oversight</p></main></body></html>
